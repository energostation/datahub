apiVersion: 1

# Loki/Prometheus were originally provisioned without an explicit uid, so the existing
# grafana_data volume stored them under auto-generated uids. Alert rules reference them
# by the stable uids `loki`/`prometheus`, so we delete the name-matched datasources first
# and let the datasources block below recreate them with those uids. deleteDatasources is
# a no-op on a fresh volume, so this is safe and idempotent on every restart.
deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Prometheus
    orgId: 1

datasources:
  - name: TimescaleDB
    type: postgres
    access: proxy
    isDefault: true
    url: "${ENERGO_POSTGRES_HOST}:5432"
    database: "${ENERGO_POSTGRES__DATA_LOGGER__DATABASE}"
    user: "${ENERGO_POSTGRES__GRAFANA__USERNAME}"
    secureJsonData:
      password: "${ENERGO_POSTGRES__GRAFANA__PASSWORD}"
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
      searchPath: "public"
      database: "${ENERGO_POSTGRES__DATA_LOGGER__DATABASE}"
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
  - name: Prometheus
    type: prometheus
    uid: prometheus
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
