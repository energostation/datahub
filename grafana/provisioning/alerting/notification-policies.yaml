apiVersion: 1

# Routing tree. Everything goes to the slack-ops contact point, grouped by alert name
# and container so related firings collapse into one Slack thread.
policies:
  - orgId: 1
    receiver: slack-ops
    group_by:
      - alertname
      - container
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
